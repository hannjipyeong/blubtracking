<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="petalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF80AB" />
      <stop offset="100%" stop-color="#F50057" />
    </radialGradient>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="100%" stop-color="#FBC02D" />
    </radialGradient>
    <filter id="flowerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#880E4F" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- 5 Petals -->
  <g filter="url(#flowerShadow)">
    <circle cx="60" cy="36" r="20" fill="url(#petalGrad)" stroke="#FFF" stroke-width="1.5" />
    <circle cx="83" cy="52" r="20" fill="url(#petalGrad)" stroke="#FFF" stroke-width="1.5" />
    <circle cx="74" cy="80" r="20" fill="url(#petalGrad)" stroke="#FFF" stroke-width="1.5" />
    <circle cx="46" cy="80" r="20" fill="url(#petalGrad)" stroke="#FFF" stroke-width="1.5" />
    <circle cx="37" cy="52" r="20" fill="url(#petalGrad)" stroke="#FFF" stroke-width="1.5" />
  </g>
  <!-- Center Core -->
  <circle cx="60" cy="60" r="18" fill="url(#centerGrad)" stroke="#FFF" stroke-width="2.5" />
  <circle cx="56" cy="57" r="2" fill="#5D4037" />
  <circle cx="64" cy="57" r="2" fill="#5D4037" />
  <path d="M 57 63 Q 60 66 63 63" fill="none" stroke="#5D4037" stroke-width="2" stroke-linecap="round" />
</svg>

