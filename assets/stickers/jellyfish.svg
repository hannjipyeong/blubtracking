<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="jf-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="jf-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E040FB" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="jf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00E5FF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#jf-glow)">
    <!-- Jellyfish Bell / Cap -->
    <path d="M 30,75 C 30,28 130,28 130,75 C 130,86 118,92 108,86 C 98,80 88,90 80,86 C 72,90 62,80 52,86 C 42,92 30,86 30,75 Z" fill="url(#jf-grad)"/>
    
    <!-- Inner dome highlight -->
    <path d="M 45,65 C 45,38 115,38 115,65 C 105,70 95,62 80,64 C 65,62 55,70 45,65 Z" fill="url(#jf-inner)"/>

    <!-- Light reflection spots -->
    <ellipse cx="55" cy="45" rx="8" ry="5" fill="#FFFFFF" opacity="0.7" transform="rotate(-20 55 45)"/>
    <circle cx="68" cy="40" r="3" fill="#FFFFFF" opacity="0.6"/>

    <!-- Eyes (Cute Anime Style) -->
    <ellipse cx="62" cy="65" rx="5" ry="6" fill="#1A237E"/>
    <ellipse cx="98" cy="65" rx="5" ry="6" fill="#1A237E"/>
    <circle cx="60" cy="63" r="2.2" fill="#FFFFFF"/>
    <circle cx="96" cy="63" r="2.2" fill="#FFFFFF"/>
    <circle cx="64" cy="68" r="1.2" fill="#FFFFFF"/>
    <circle cx="100" cy="68" r="1.2" fill="#FFFFFF"/>

    <!-- Cute Smiling Mouth -->
    <path d="M 76,70 Q 80,74 84,70" fill="none" stroke="#1A237E" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Blush Cheeks -->
    <ellipse cx="52" cy="71" rx="5" ry="3" fill="#FF4081" opacity="0.6"/>
    <ellipse cx="108" cy="71" rx="5" ry="3" fill="#FF4081" opacity="0.6"/>

    <!-- Tentacles -->
    <!-- Center ribbon tentacles -->
    <path d="M 70,88 C 65,105 78,125 72,145" fill="none" stroke="#E040FB" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 90,88 C 95,105 82,125 88,145" fill="none" stroke="#E040FB" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Outer curly tentacles -->
    <path d="M 46,87 C 38,102 52,120 44,138" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 60,88 C 54,106 66,126 58,142" fill="none" stroke="#80D8FF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 100,88 C 106,106 94,126 102,142" fill="none" stroke="#80D8FF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 114,87 C 122,102 108,120 116,138" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>

    <!-- Small water bubbles -->
    <circle cx="34" cy="50" r="4" fill="#80D8FF" opacity="0.6"/>
    <circle cx="36" cy="42" r="2.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="126" cy="48" r="4" fill="#80D8FF" opacity="0.6"/>
    <circle cx="128" cy="40" r="2.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>

