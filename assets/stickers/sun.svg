<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7B2" />
      <stop offset="60%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF6F00" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Sun Rays -->
  <g filter="url(#dropShadow)" stroke="#FFA000" stroke-width="4.5" stroke-linecap="round">
    <line x1="60" y1="10" x2="60" y2="24" />
    <line x1="60" y1="96" x2="60" y2="110" />
    <line x1="10" y1="60" x2="24" y2="60" />
    <line x1="96" y1="60" x2="110" y2="60" />
    <line x1="24.6" y1="24.6" x2="34.5" y2="34.5" />
    <line x1="85.5" y1="85.5" x2="95.4" y2="95.4" />
    <line x1="24.6" y1="95.4" x2="34.5" y2="85.5" />
    <line x1="85.5" y1="34.5" x2="95.4" y2="24.6" />
  </g>
  <!-- Sun Core Body -->
  <circle cx="60" cy="60" r="34" fill="url(#sunGlow)" filter="url(#dropShadow)" stroke="#FFF" stroke-width="2.5" />
  <!-- Cute Face -->
  <ellipse cx="50" cy="55" rx="3.5" ry="4.5" fill="#3E2723" />
  <ellipse cx="70" cy="55" rx="3.5" ry="4.5" fill="#3E2723" />
  <circle cx="51.5" cy="53.5" r="1.5" fill="#FFF" />
  <circle cx="71.5" cy="53.5" r="1.5" fill="#FFF" />
  <ellipse cx="44" cy="62" rx="4.5" ry="2.5" fill="#FF5252" opacity="0.6" />
  <ellipse cx="76" cy="62" rx="4.5" ry="2.5" fill="#FF5252" opacity="0.6" />
  <path d="M 52 64 Q 60 72 68 64" fill="none" stroke="#3E2723" stroke-width="3" stroke-linecap="round" />
</svg>

