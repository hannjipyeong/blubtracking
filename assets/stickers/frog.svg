<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="frog-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76FF03"/>
      <stop offset="50%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
    <linearGradient id="frog-belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFF8D"/>
      <stop offset="100%" stop-color="#F4FF81"/>
    </linearGradient>
    <filter id="frog-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#007E33" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#frog-shadow)">
    <!-- Eye Bumps -->
    <circle cx="50" cy="50" r="22" fill="url(#frog-body)"/>
    <circle cx="110" cy="50" r="22" fill="url(#frog-body)"/>

    <!-- Main Head / Body -->
    <ellipse cx="80" cy="85" rx="58" ry="44" fill="url(#frog-body)"/>

    <!-- Yellow Belly / Throat -->
    <ellipse cx="80" cy="98" rx="34" ry="24" fill="url(#frog-belly)"/>

    <!-- Left Eye -->
    <circle cx="50" cy="48" r="16" fill="#FFFFFF"/>
    <ellipse cx="50" cy="48" rx="8" ry="11" fill="#1B5E20"/>
    <circle cx="47" cy="44" r="4.5" fill="#FFFFFF"/>
    <circle cx="53" cy="52" r="2" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <circle cx="110" cy="48" r="16" fill="#FFFFFF"/>
    <ellipse cx="110" cy="48" rx="8" ry="11" fill="#1B5E20"/>
    <circle cx="107" cy="44" r="4.5" fill="#FFFFFF"/>
    <circle cx="113" cy="52" r="2" fill="#FFFFFF"/>

    <!-- Cute Nostrils -->
    <circle cx="75" cy="74" r="1.8" fill="#1B5E20"/>
    <circle cx="85" cy="74" r="1.8" fill="#1B5E20"/>

    <!-- Wide Happy Frog Mouth -->
    <path d="M 52,82 Q 80,102 108,82" fill="none" stroke="#1B5E20" stroke-width="3" stroke-linecap="round"/>
    <circle cx="52" cy="82" r="2" fill="#1B5E20"/>
    <circle cx="108" cy="82" r="2" fill="#1B5E20"/>

    <!-- Rosy Cheek Blushes -->
    <ellipse cx="40" cy="82" rx="8" ry="5" fill="#FF4081" opacity="0.5"/>
    <ellipse cx="120" cy="82" rx="8" ry="5" fill="#FF4081" opacity="0.5"/>

    <!-- Little Frog Hands / Webbed feet -->
    <g fill="#00E676" stroke="#1B5E20" stroke-width="1.5">
      <ellipse cx="48" cy="126" rx="8" ry="6"/>
      <ellipse cx="40" cy="123" rx="7" ry="5"/>
      <ellipse cx="56" cy="123" rx="7" ry="5"/>

      <ellipse cx="112" cy="126" rx="8" ry="6"/>
      <ellipse cx="104" cy="123" rx="7" ry="5"/>
      <ellipse cx="120" cy="123" rx="7" ry="5"/>
    </g>
  </g>
</svg>

