<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bear-fur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#6D4C41"/>
    </linearGradient>
    <linearGradient id="bear-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="100%" stop-color="#BCAAA4"/>
    </linearGradient>
    <filter id="bear-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#3E2723" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#bear-shadow)">
    <!-- Round Ears -->
    <circle cx="44" cy="48" r="20" fill="url(#bear-fur)"/>
    <circle cx="116" cy="48" r="20" fill="url(#bear-fur)"/>
    <circle cx="44" cy="48" r="11" fill="url(#bear-inner)"/>
    <circle cx="116" cy="48" r="11" fill="url(#bear-inner)"/>

    <!-- Head -->
    <ellipse cx="80" cy="85" rx="54" ry="46" fill="url(#bear-fur)"/>

    <!-- Muzzle / Snout -->
    <ellipse cx="80" cy="95" rx="28" ry="20" fill="#EFEBE9"/>

    <!-- Cute Eyes -->
    <circle cx="58" cy="78" r="6" fill="#271406"/>
    <circle cx="102" cy="78" r="6" fill="#271406"/>
    <!-- Catchlights -->
    <circle cx="56" cy="76" r="2.2" fill="#FFFFFF"/>
    <circle cx="100" cy="76" r="2.2" fill="#FFFFFF"/>
    <circle cx="60" cy="80" r="1.2" fill="#FFFFFF"/>
    <circle cx="104" cy="80" r="1.2" fill="#FFFFFF"/>

    <!-- Heart/Oval Shaped Bear Nose -->
    <path d="M 73,88 C 73,85 77,83 80,86 C 83,83 87,85 87,88 C 87,93 80,97 80,97 C 80,97 73,93 73,88 Z" fill="#3E2723"/>

    <!-- Bear Mouth -->
    <path d="M 80,97 L 80,103" stroke="#3E2723" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 74,103 Q 80,108 80,103 Q 80,108 86,103" fill="none" stroke="#3E2723" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cheeks (Blushing) -->
    <ellipse cx="44" cy="90" rx="8" ry="5" fill="#FF8A80" opacity="0.6"/>
    <ellipse cx="116" cy="90" rx="8" ry="5" fill="#FF8A80" opacity="0.6"/>

    <!-- Cute Bear Paws Waving -->
    <g fill="url(#bear-fur)">
      <circle cx="34" cy="116" r="14"/>
      <circle cx="126" cy="116" r="14"/>
    </g>
    <!-- Paw Pads -->
    <g fill="#FFAB91">
      <ellipse cx="34" cy="117" rx="7" ry="5"/>
      <circle cx="28" cy="109" r="2.5"/>
      <circle cx="34" cy="107" r="2.5"/>
      <circle cx="40" cy="109" r="2.5"/>

      <ellipse cx="126" cy="117" rx="7" ry="5"/>
      <circle cx="120" cy="109" r="2.5"/>
      <circle cx="126" cy="107" r="2.5"/>
      <circle cx="132" cy="109" r="2.5"/>
    </g>
  </g>
</svg>

