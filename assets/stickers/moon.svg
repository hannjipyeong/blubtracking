<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="moonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA" />
      <stop offset="60%" stop-color="#80DEEA" />
      <stop offset="100%" stop-color="#00ACC1" />
    </linearGradient>
    <filter id="moonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00838F" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Crescent Moon -->
  <path d="M 68 18 C 88 32 90 74 65 96 C 45 113 20 100 15 92 C 42 102 78 84 76 46 C 75 32 68 22 68 18 Z" 
        fill="url(#moonGlow)" filter="url(#moonShadow)" stroke="#FFF" stroke-width="2" />
  <!-- Small Star -->
  <polygon points="92,26 95,35 104,36 97,42 99,51 92,46 85,51 87,42 80,36 89,35" fill="#FFF59D" />
  <!-- Sleeping Face -->
  <path d="M 52 56 Q 58 60 64 56" fill="none" stroke="#004D40" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="58" cy="67" r="3" fill="#FF80AB" opacity="0.6" />
</svg>

