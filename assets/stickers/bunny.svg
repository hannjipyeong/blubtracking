<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bunny-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
    <linearGradient id="bunny-pink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF80AB"/>
      <stop offset="100%" stop-color="#F48FB1"/>
    </linearGradient>
    <filter id="bunny-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#CE93D8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#bunny-shadow)">
    <!-- Long Ears -->
    <path d="M 44,70 C 26,10 56,-4 64,55 Z" fill="url(#bunny-body)"/>
    <path d="M 116,70 C 134,10 104,-4 96,55 Z" fill="url(#bunny-body)"/>
    <!-- Inner Ears -->
    <path d="M 47,60 C 35,18 55,8 60,50 Z" fill="url(#bunny-pink)"/>
    <path d="M 113,60 C 125,18 105,8 100,50 Z" fill="url(#bunny-pink)"/>

    <!-- Head -->
    <ellipse cx="80" cy="94" rx="50" ry="42" fill="url(#bunny-body)"/>

    <!-- Eyes (Big Sparkling) -->
    <ellipse cx="60" cy="90" rx="6.5" ry="8" fill="#C2185B"/>
    <ellipse cx="100" cy="90" rx="6.5" ry="8" fill="#C2185B"/>
    <circle cx="58" cy="87" r="3" fill="#FFFFFF"/>
    <circle cx="98" cy="87" r="3" fill="#FFFFFF"/>
    <circle cx="62" cy="93" r="1.5" fill="#FFFFFF"/>
    <circle cx="102" cy="93" r="1.5" fill="#FFFFFF"/>

    <!-- Little Pink Nose -->
    <ellipse cx="80" cy="98" rx="4" ry="3" fill="#FF4081"/>

    <!-- Mouth -->
    <path d="M 75,103 Q 80,107 80,102 Q 80,107 85,103" fill="none" stroke="#880E4F" stroke-width="2" stroke-linecap="round"/>

    <!-- Cute Whiskers -->
    <line x1="38" y1="98" x2="52" y2="100" stroke="#BDBDBD" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="37" y1="106" x2="51" y2="105" stroke="#BDBDBD" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="122" y1="98" x2="108" y2="100" stroke="#BDBDBD" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="123" y1="106" x2="109" y2="105" stroke="#BDBDBD" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Blushing Pink Cheeks -->
    <ellipse cx="48" cy="98" rx="8" ry="5" fill="#FF4081" opacity="0.45"/>
    <ellipse cx="112" cy="98" rx="8" ry="5" fill="#FF4081" opacity="0.45"/>

    <!-- Paws -->
    <ellipse cx="62" cy="132" rx="11" ry="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
    <ellipse cx="98" cy="132" rx="11" ry="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  </g>
</svg>

