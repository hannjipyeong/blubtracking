<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="cat-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#FB8C00"/>
    </linearGradient>
    <linearGradient id="cat-ear-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF80AB"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>
    <filter id="cat-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#E65100" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#cat-shadow)">
    <!-- Ears -->
    <path d="M 38,72 L 26,24 L 68,44 Z" fill="url(#cat-body)"/>
    <path d="M 122,72 L 134,24 L 92,44 Z" fill="url(#cat-body)"/>
    <!-- Inner Ears -->
    <path d="M 39,64 L 32,32 L 60,46 Z" fill="url(#cat-ear-inner)"/>
    <path d="M 121,64 L 128,32 L 100,46 Z" fill="url(#cat-ear-inner)"/>

    <!-- Head -->
    <ellipse cx="80" cy="85" rx="54" ry="46" fill="url(#cat-body)"/>

    <!-- Forehead Stripes -->
    <path d="M 76,46 L 84,46 L 82,56 L 78,56 Z" fill="#E65100"/>
    <path d="M 64,50 L 70,50 L 67,58 L 63,58 Z" fill="#E65100"/>
    <path d="M 96,50 L 90,50 L 93,58 L 97,58 Z" fill="#E65100"/>

    <!-- White Muzzle -->
    <ellipse cx="80" cy="98" rx="26" ry="18" fill="#FFF8E1"/>

    <!-- Eyes (Big Kawaii Anime Eyes) -->
    <ellipse cx="58" cy="82" rx="7" ry="8.5" fill="#2E7D32"/>
    <ellipse cx="102" cy="82" rx="7" ry="8.5" fill="#2E7D32"/>
    <circle cx="58" cy="82" r="5.5" fill="#1B5E20"/>
    <circle cx="102" cy="82" r="5.5" fill="#1B5E20"/>
    <!-- Catchlights -->
    <circle cx="56" cy="79" r="3" fill="#FFFFFF"/>
    <circle cx="100" cy="79" r="3" fill="#FFFFFF"/>
    <circle cx="61" cy="85" r="1.5" fill="#FFFFFF"/>
    <circle cx="105" cy="85" r="1.5" fill="#FFFFFF"/>

    <!-- Cute Triangle Nose -->
    <path d="M 76,92 L 84,92 L 80,97 Z" fill="#FF4081"/>

    <!-- Cat Mouth :3 -->
    <path d="M 74,99 Q 80,104 80,98 Q 80,104 86,99" fill="none" stroke="#5D4037" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="28" y1="92" x2="50" y2="95" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
    <line x1="27" y1="102" x2="49" y2="101" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
    <line x1="132" y1="92" x2="110" y2="95" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
    <line x1="133" y1="102" x2="111" y2="101" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>

    <!-- Pink Blushes -->
    <ellipse cx="44" cy="90" rx="7" ry="4" fill="#FF5252" opacity="0.45"/>
    <ellipse cx="116" cy="90" rx="7" ry="4" fill="#FF5252" opacity="0.45"/>

    <!-- Little Paws at bottom -->
    <ellipse cx="58" cy="126" rx="13" ry="10" fill="#FFF8E1"/>
    <ellipse cx="102" cy="126" rx="13" ry="10" fill="#FFF8E1"/>
    <path d="M 54,124 Q 58,121 62,124" fill="none" stroke="#FFB74D" stroke-width="2"/>
    <path d="M 98,124 Q 102,121 106,124" fill="none" stroke="#FFB74D" stroke-width="2"/>
  </g>
</svg>

